<script>
const unitWeight = {
  RB6:0.222, RB9:0.499, DB12:0.888, DB16:1.58,
  DB20:2.47, DB25:3.85, DB28:4.83
};

const rateDefaults = {
  concrete:{label:"คอนกรีต (บาท/m³)",value:2500},
  rebar:{label:"เหล็กเสริม (บาท/kg)",value:30},
  formwork:{label:"ไม้แบบ (บาท/m²)",value:350},
  excavation:{label:"ขุดดิน (บาท/m³)",value:150},
  backfill:{label:"ถมดิน/ทราย (บาท/m³)",value:200},
  laborConc:{label:"ค่าแรงคอนกรีต (บาท/m³)",value:500},
  laborRebar:{label:"ค่าแรงผูกเหล็ก (บาท/kg)",value:5},
  laborForm:{label:"ค่าแรงไม้แบบ (บาท/m²)",value:150},
  laborExc:{label:"ค่าแรงขุด (บาท/m³)",value:0},
  laborFill:{label:"ค่าแรงถม (บาท/m³)",value:0}
};

const $ = id => document.getElementById(id);
const val = id => Number($(id)?.value) || 0;
const money = n => (Number(n)||0).toLocaleString("th-TH", {
  minimumFractionDigits:2, maximumFractionDigits:2
});
const safe = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

let items = [];
let rates = JSON.parse(localStorage.getItem("qtoRates") || "null") ||
  Object.fromEntries(Object.entries(rateDefaults).map(([k,v]) => [k,v.value]));

function todayLocal() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

if (!$("reportDate").value) $("reportDate").value = todayLocal();

function isMatType(type) {
  return ["Footing","Slab on Ground","Elevated Slab","Precast Slab"].includes(type);
}
function isStirrupType(type) {
  return ["Ground Beam","Beam","Stub Column","Column"].includes(type);
}
function updateRebarFields() {
  const type = $("type").value;
  const mat = isMatType(type);
  $("matFields").classList.toggle("hidden", !mat);
  $("stirrupFields").classList.toggle("hidden", !isStirrupType(type));
  $("longitudinalFields").classList.toggle("hidden", mat);
}
$("type").addEventListener("change", updateRebarFields);
updateRebarFields();

function getState() {
  return {
    projectInfo:{
      projectName:$("projectName").value,
      ownerName:$("ownerName").value,
      estimatorName:$("estimatorName").value,
      reportDate:$("reportDate").value
    },
    items, rates,
    overhead:$("overhead").value,
    profit:$("profit").value,
    vat:$("vat").value,
    wht:$("wht").value
  };
}

function persistCurrent() {
  localStorage.setItem("qtoCurrent", JSON.stringify(getState()));
}

function loadState(state) {
  if (!state) return;
  const p = state.projectInfo || {};
  $("projectName").value = p.projectName || "";
  $("ownerName").value = p.ownerName || "";
  $("estimatorName").value = p.estimatorName || "";
  $("reportDate").value = p.reportDate || todayLocal();

  items = Array.isArray(state.items) ? state.items : [];
  rates = state.rates || rates;
  $("overhead").value = state.overhead ?? 10;
  $("profit").value = state.profit ?? 10;
  $("vat").value = state.vat ?? 7;
  $("wht").value = state.wht ?? 3;

  renderRates();
  render();
}

function getSavedProjects() {
  try { return JSON.parse(localStorage.getItem("qtoProjects") || "{}"); }
  catch { return {}; }
}

function refreshProjectList(selectedName="") {
  const projects = getSavedProjects();
  $("savedProjects").innerHTML =
    `<option value="">เลือกโครงการที่บันทึกไว้</option>` +
    Object.keys(projects).sort().map(name =>
      `<option value="${safe(name)}">${safe(name)}</option>`
    ).join("");
  $("savedProjects").value = selectedName;
}

function saveProject() {
  const name = $("projectName").value.trim();
  if (!name) return alert("กรุณากรอกชื่อโครงการก่อนบันทึก");
  const projects = getSavedProjects();
  projects[name] = getState();
  localStorage.setItem("qtoProjects", JSON.stringify(projects));
  refreshProjectList(name);
  persistCurrent();
  alert(`บันทึกโครงการ “${name}” เรียบร้อยแล้ว`);
}

function loadProject() {
  const name = $("savedProjects").value;
  if (!name) return alert("กรุณาเลือกโครงการที่ต้องการโหลด");
  const state = getSavedProjects()[name];
  if (!state) return alert("ไม่พบข้อมูลโครงการนี้");
  loadState(state);
  persistCurrent();
}

function renderRates() {
  $("rateInputs").innerHTML = Object.entries(rateDefaults).map(([key,def]) => `
    <label class="text-xs">${def.label}
      <input type="number" min="0" step="0.01" value="${rates[key] ?? def.value}"
        data-rate="${key}" class="rate-input mt-1 w-full border rounded-lg p-2">
    </label>`).join("");

  document.querySelectorAll(".rate-input").forEach(el =>
    el.addEventListener("input", () => {
      rates[el.dataset.rate] = Number(el.value) || 0;
      localStorage.setItem("qtoRates", JSON.stringify(rates));
      render();
    })
  );
}

function barLengthWithLaps(length, stock, lapLength) {
  const laps = Math.max(0, Math.ceil(length / stock) - 1);
  return {length:length + laps * lapLength, laps};
}

$("qtoForm").addEventListener("submit", e => {
  e.preventDefault();

  const type = $("type").value;
  const qty = Math.max(1, val("qty"));
  const name = $("name").value.trim();
  const w = val("width"), L = val("length"), d = val("depth"), rise = val("rise");

  if (!name || w <= 0 || L <= 0 || d < 0) {
    return alert("กรุณาตรวจสอบชื่อและขนาดองค์อาคาร");
  }

  let concrete=0, form=0, excavation=0, backfill=0;

  if (type === "Footing") {
    concrete=w*L*d*qty;
    form=2*(w+L)*d*qty;
    excavation=(w+2*val("excClear"))*(L+2*val("excClear"))*val("excDepth")*qty;
  } else if (type === "Ground Beam") {
    concrete=w*L*d*qty;
    form=(2*d+w)*L*qty;
    excavation=(w+2*val("excClear"))*L*val("excDepth")*qty;
  } else if (type === "Stub Column" || type === "Column") {
    concrete=w*d*L*qty;
    form=2*(w+d)*L*qty;
    if (type === "Stub Column") {
      excavation=(w+2*val("excClear"))*(d+2*val("excClear"))*val("excDepth")*qty;
    }
  } else if (type === "Beam") {
    concrete=w*d*L*qty;
    form=(2*d+w)*L*qty;
  } else if (type === "Slab on Ground") {
    concrete=w*L*d*qty;
    form=2*(w+L)*d*qty;
  } else if (type === "Elevated Slab" || type === "Precast Slab") {
    concrete=w*L*d*qty;
    form=(w*L+2*(w+L)*d)*qty;
  } else if (type === "Ground Stair") {
    const slope=Math.sqrt(L*L+rise*rise);
    concrete=(w*slope*d+0.5*w*L*rise)*qty;
    form=(w*slope+rise*slope)*qty;
  }

  const grade=$("grade").value;
  const mainSize=$("barSize").value;
  const diaM=parseInt(mainSize.replace(/\D/g,""),10)/1000;
  const stock=Math.max(1,val("stockLength"));
  const lapLength=val("lapRatio")*diaM;

  let mainKg=0, stirrupKg=0, laps=0;
  let stirrupSize="NONE";

  if (isMatType(type)) {
    const sx=Math.max(0.01,val("matSpacingX"));
    const sy=Math.max(0.01,val("matSpacingY"));
    const layers=(($("matBottom").checked ? 1 : 0)+($("matTop").checked ? 1 : 0));
    const barsAlongL=Math.ceil(w/sx)+1;
    const barsAlongW=Math.ceil(L/sy)+1;
    const runL=barLengthWithLaps(L,stock,lapLength);
    const runW=barLengthWithLaps(w,stock,lapLength);
    laps=(barsAlongL*runL.laps+barsAlongW*runW.laps)*layers*qty;
    const totalLength=(barsAlongL*runL.length+barsAlongW*runW.length)*layers*qty;
    mainKg=totalLength*(unitWeight[mainSize]||0);
  } else {
    const run=barLengthWithLaps(L,stock,lapLength);
    laps=run.laps;
    mainKg=val("barCount")*run.length*(unitWeight[mainSize]||0)*qty;
  }

  if (isStirrupType(type)) {
    stirrupSize=$("stirrupSize").value;
    const spacing=Math.max(0.01,val("spacing"));
    if (stirrupSize !== "NONE" && unitWeight[stirrupSize]) {
      const stirrupDia=parseInt(stirrupSize.replace(/\D/g,""),10)/1000;
      const n=(Math.ceil(L/spacing)+1)*qty;
      const innerW=Math.max(0,w-2*val("cover"));
      const innerD=Math.max(0,d-2*val("cover"));
      const hookLength=2*val("hookRatio")*stirrupDia;
      stirrupKg=n*(2*(innerW+innerD)+hookLength)*(unitWeight[stirrupSize]||0);
    }
  }

  if (type === "Roof Truss") {
    concrete=0; form=0; excavation=0; backfill=0;
    mainKg=val("manualSteel")*qty;
    stirrupKg=0;
  }

  const wastePct=Math.max(0,val("waste"))/100;
  const rebarNoWaste=mainKg+stirrupKg;
  const rebarTotal=rebarNoWaste*(1+wastePct);

  if (excavation > 0) {
    const sand=Math.min(
      excavation,
      val("sandBed")*excavation/Math.max(val("excDepth"),0.01)
    );
    backfill=Math.max(0,excavation-concrete-sand);
  }

  items.push({
    id:Date.now()+Math.random(), name, type, qty, grade, mainSize, stirrupSize,
    concrete, form, excavation, backfill,
    rebar:rebarTotal, rebarNoWaste, mainKg, stirrupKg,
    wastePct, lapLength, laps
  });

  $("qtoForm").reset();
  $("qty").value=1;
  $("width").value="0.20";
  $("length").value="4.00";
  $("depth").value="0.40";
  $("barCount").value=4;
  $("stockLength").value=10;
  $("lapRatio").value=60;
  $("waste").value=5;
  $("matSpacingX").value=0.20;
  $("matSpacingY").value=0.20;
  $("matBottom").checked=true;
  $("matTop").checked=true;
  $("spacing").value=0.15;
  $("cover").value=0.04;
  $("hookRatio").value=10;
  $("excClear").value=0.30;
  $("excDepth").value=0.80;
  $("sandBed").value=0.05;
  $("rise").value=0;
  updateRebarFields();
  render();
});

function calcTotals() {
  const t=items.reduce((a,i) => {
    a.concrete+=i.concrete; a.form+=i.form; a.exc+=i.excavation;
    a.fill+=i.backfill; a.rebar+=i.rebar;
    return a;
  },{concrete:0,form:0,exc:0,fill:0,rebar:0});

  const material=t.concrete*(rates.concrete||0)+t.rebar*(rates.rebar||0)+
    t.form*(rates.formwork||0)+t.exc*(rates.excavation||0)+t.fill*(rates.backfill||0);
  const labor=t.concrete*(rates.laborConc||0)+t.rebar*(rates.laborRebar||0)+
    t.form*(rates.laborForm||0)+t.exc*(rates.laborExc||0)+t.fill*(rates.laborFill||0);
  const direct=material+labor;
  const overhead=direct*val("overhead")/100;
  const profit=(direct+overhead)*val("profit")/100;
  const preVat=direct+overhead+profit;
  const vat=preVat*val("vat")/100;
  const wht=preVat*val("wht")/100;
  return {...t,material,labor,direct,overhead,profit,preVat,vat,wht,net:preVat+vat-wht};
}

function render() {
  $("rows").innerHTML=items.map(i => {
    const direct=i.concrete*(rates.concrete||0)+i.rebar*(rates.rebar||0)+
      i.form*(rates.formwork||0)+i.excavation*(rates.excavation||0)+
      i.backfill*(rates.backfill||0)+i.concrete*(rates.laborConc||0)+
      i.rebar*(rates.laborRebar||0)+i.form*(rates.laborForm||0)+
      i.excavation*(rates.laborExc||0)+i.backfill*(rates.laborFill||0);

    return `<tr class="border-b">
      <td class="p-2"><b>${safe(i.name)}</b>
        <div class="text-xs text-slate-500">${safe(i.type)} · ${safe(i.grade)}</div></td>
      <td class="p-2">${i.qty}</td>
      <td class="p-2">${i.concrete.toFixed(2)}</td>
      <td class="p-2">${i.form.toFixed(2)}</td>
      <td class="p-2">${i.excavation.toFixed(2)}</td>
      <td class="p-2">${i.backfill.toFixed(2)}</td>
      <td class="p-2">${i.rebar.toFixed(2)}</td>
      <td class="p-2">${money(direct)}</td>
      <td class="p-2 no-print">
        <button onclick="removeItem('${i.id}')" class="text-red-600">ลบ</button>
      </td>
    </tr>`;
  }).join("");

  const t=calcTotals();
  $("summary").innerHTML=[
    ["ค่าวัสดุ",t.material],["ค่าแรง",t.labor],["ต้นทุนตรง",t.direct],
    ["Overhead",t.overhead],["กำไร",t.profit],["ก่อน VAT",t.preVat],
    ["VAT",t.vat],["หัก ณ ที่จ่าย",t.wht],["ยอดรับสุทธิประมาณ",t.net]
  ].map(([label,value]) => `<div class="bg-slate-50 p-3 rounded-xl">
    <div class="text-xs text-slate-500">${label}</div>
    <div class="font-semibold">${money(value)} บาท</div>
  </div>`).join("");

  const groups={};
  items.forEach(i => {
    const factor=1+(i.wastePct||0)/100;
    const mainKey=`${i.grade}|${i.mainSize}`;
    groups[mainKey]=(groups[mainKey]||0)+(i.mainKg||0)*factor;

    if (i.stirrupSize && i.stirrupSize!=="NONE" && i.stirrupKg) {
      const key=`${i.grade}|${i.stirrupSize}`;
      groups[key]=(groups[key]||0)+i.stirrupKg*factor;
    }
  });

  $("rebarRows").innerHTML=Object.entries(groups).map(([key,kg]) => {
    const [g,s]=key.split("|");
    return `<tr class="border-b"><td class="p-2">${safe(g)}</td>
      <td class="p-2">${safe(s)}</td><td class="p-2">${kg.toFixed(2)}</td>
      <td class="p-2">${(kg/1000).toFixed(3)}</td></tr>`;
  }).join("") || `<tr><td colspan="4" class="p-3 text-slate-500">ยังไม่มีรายการ</td></tr>`;

  persistCurrent();
}

window.removeItem=id => {
  items=items.filter(i => String(i.id)!==String(id));
  render();
};

["overhead","profit","vat","wht"].forEach(id =>
  $(id).addEventListener("input",render)
);

["projectName","ownerName","estimatorName","reportDate"].forEach(id =>
  $(id).addEventListener("input",persistCurrent)
);

function exportExcel() {
  if (!items.length) return alert("กรุณาเพิ่มรายการก่อน Export");
  if (!window.XLSX) return alert("โหลดไลบรารี Excel ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต");

  const wb=XLSX.utils.book_new();
  const project=[{
    "ชื่อโครงการ":$("projectName").value,
    "เจ้าของงาน":$("ownerName").value,
    "ผู้ถอดแบบ":$("estimatorName").value,
    "วันที่":$("reportDate").value
  }];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(project),"Project");

  const boq=items.map(i => ({
    "ชื่อ":i.name,"ประเภท":i.type,"จำนวน":i.qty,"เกรดเหล็ก":i.grade,
    "คอนกรีต (m3)":Number(i.concrete.toFixed(3)),
    "ไม้แบบ (m2)":Number(i.form.toFixed(3)),
    "ขุดดิน (m3)":Number(i.excavation.toFixed(3)),
    "ถมดิน (m3)":Number(i.backfill.toFixed(3)),
    "เหล็กหลัก/ตะแกรง":i.mainSize,
    "เหล็กปลอก":i.stirrupSize,
    "น้ำหนักเหล็กหลัก/ตะแกรง (kg)":Number((i.mainKg||0).toFixed(2)),
    "น้ำหนักเหล็กปลอก (kg)":Number((i.stirrupKg||0).toFixed(2)),
    "เหล็กรวมเผื่อเศษ (kg)":Number(i.rebar.toFixed(2)),
    "เผื่อเศษ (%)":i.wastePct,
    "ระยะทาบ (m)":Number(i.lapLength.toFixed(3)),
    "จำนวนจุดทาบโดยประมาณ":i.laps
  }));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(boq),"BOQ");

  const t=calcTotals();
  const summary=[
    {รายการ:"ปริมาตรคอนกรีตรวม (m3)",จำนวน:t.concrete},
    {รายการ:"พื้นที่ไม้แบบรวม (m2)",จำนวน:t.form},
    {รายการ:"ปริมาตรขุดดินรวม (m3)",จำนวน:t.exc},
    {รายการ:"ปริมาตรถมรวม (m3)",จำนวน:t.fill},
    {รายการ:"เหล็กรวม (kg)",จำนวน:t.rebar},
    {รายการ:"เหล็กรวม (ton)",จำนวน:t.rebar/1000},
    {รายการ:"ค่าวัสดุ (บาท)",จำนวน:t.material},
    {รายการ:"ค่าแรง (บาท)",จำนวน:t.labor},
    {รายการ:"ต้นทุนตรง (บาท)",จำนวน:t.direct},
    {รายการ:"Overhead (บาท)",จำนวน:t.overhead},
    {รายการ:"กำไร (บาท)",จำนวน:t.profit},
    {รายการ:"ก่อน VAT (บาท)",จำนวน:t.preVat},
    {รายการ:"VAT (บาท)",จำนวน:t.vat},
    {รายการ:"หัก ณ ที่จ่าย (บาท)",จำนวน:t.wht},
    {รายการ:"ยอดรับสุทธิประมาณ (บาท)",จำนวน:t.net}
  ];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),"Summary");

  const rateData=Object.entries(rateDefaults).map(([key,d]) => ({
    รายการ:d.label, ราคา:rates[key]||0
  }));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rateData),"Rates");
  XLSX.writeFile(wb,"Structural_QTO_BOQ.xlsx");
}

renderRates();
refreshProjectList();

const savedCurrent=localStorage.getItem("qtoCurrent");
if (savedCurrent) {
  try { loadState(JSON.parse(savedCurrent)); }
  catch (e) { render(); }
} else {
  render();
}
</script>
